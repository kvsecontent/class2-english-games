<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; width: 100%; max-width: 100rem; }
  .bin { min-height: 20rem; border-radius: var(--radius); border: 0.3rem dashed var(--line); background: #fff; padding: 1rem; display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
  .bin h3 { margin: 0; font-size: 2rem; }
  .bin .big { font-size: 5rem; line-height: 1; transition: transform 0.4s; }
  .bin .got { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
  .bin .got span { font-family: var(--read); font-size: 2.2rem; font-weight: 700; background: #d9f7e8; color: #117a4a; border-radius: 0.8rem; padding: 0.2rem 1rem; animation: pop 0.35s; }
  .bin.day { border-color: var(--yellow); background: #e9f6ff; } .bin.night { border-color: var(--purple); background: #2b2160; color: #fff; }
  .bin.night .got span { background: #4b3c9a; color: #fff; }
  .bin.nope { background: #ffe1e3; animation: shake 0.4s; }
  .bank { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin: 1.4rem 0 0.4rem; max-width: 100rem; }
  .chip { border: 0; border-radius: 1rem; background: var(--purple); color: #fff; font-family: var(--read); font-size: 2.3rem; font-weight: 700;
    padding: 0.5rem 1.4rem; min-height: 4.4rem; box-shadow: 0 0.35rem 0 rgba(0, 0, 0, 0.2); }
  .chip.used { visibility: hidden; }
  .chip.gone { opacity: 0.3; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint">Touch and feel things in the kitchen at home (ask first!). Which ones feel <b>grainy</b>, like little grains of sand? Drag each one to the right box (or tap it, then tap the box).</p>
  <div class="bins">
    <div class="bin kids day" id="kids"><h3>🏖️ Grainy</h3><div class="got"></div></div>
    <div class="bin ball" id="ball"><h3>💧 Not grainy</h3><div class="got"></div></div>
  </div>
  <div class="bank" id="bank"></div>
  <div class="feedback" id="fb"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Is It Grainy?', subtitle: 'Little Drops of Water · Project work', back: '../index.html#ch12' });

const ITEMS = [
  { w: 'salt', e: '🧂', b: 'kids' }, { w: 'sugar', e: '🍬', b: 'kids' }, { w: 'rice', e: '🍚', b: 'kids' }, { w: 'wheat', e: '🌾', b: 'kids' },
  { w: 'banana', e: '🍌', b: 'ball' }, { w: 'oil', e: '🫒', b: 'ball' }, { w: 'milk', e: '🥛', b: 'ball' },
];
const NEED = ITEMS.filter((x) => x.b).length;

function build() {
  let done = 0;
  G.$$('.got').forEach((g) => (g.innerHTML = ''));
  G.$('#fb').textContent = '';
  G.$('#bank').innerHTML = G.shuffle(ITEMS).map((x) => `<button class="chip" data-w="${x.w}" data-b="${x.b}">${x.e} ${x.w}</button>`).join('');
  G.$$('.chip').forEach((c) => c.addEventListener('click', () => G.say(c.dataset.w)));

  G.tapDrag(G.$$('.chip'), [G.$('#kids'), G.$('#ball')], (chip, bin) => {
    if (chip.dataset.b === bin.id) {
      chip.classList.add('used');
      chip.dataset.locked = 1;
      G.$('.got', bin).insertAdjacentHTML('beforeend', `<span>${chip.textContent}</span>`);
      G.sfx('good');
      G.star();
      G.say(chip.dataset.w);
      if (++done === NEED) {
        G.$$('.chip:not(.used)').forEach((c) => c.classList.add('gone'));
        G.feedback(G.$('#fb'), true, '🎉 Salt, sugar, rice and wheat feel grainy, like little grains of sand!');
        G.say('Salt, sugar, rice and wheat feel grainy, like little grains of sand.');
        setTimeout(() => G.end({ title: 'Well done!', msg: 'Bring one grainy thing from your kitchen to class tomorrow!', onReplay: build }), 5500);
      }
    } else {
      bin.classList.add('nope');
      G.sfx('bad');
      G.feedback(G.$('#fb'), false, chip.dataset.b ? '🙂 Try the other box!' : `🙂 Is it in the sky? Try again!`);
      setTimeout(() => bin.classList.remove('nope'), 500);
    }
  });
}
build();
</script>
</body>
</html>
