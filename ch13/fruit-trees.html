<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; width: 100%; max-width: 110rem; }
  @media (max-width: 900px) { .rows { grid-template-columns: 1fr; } }
  .rowx { display: flex; align-items: center; gap: 1rem; background: #fff; border: 0.25rem solid var(--line); border-radius: 1.4rem; padding: 0.5rem 1.2rem; box-shadow: var(--shadow); font-family: var(--read); font-size: 2.5rem; font-weight: 700; }
  .rowx .e { font-size: 3.8rem; width: 5rem; text-align: center; display: inline-block; }
  .gap { display: inline-flex; align-items: center; justify-content: center; min-width: 11rem; height: 4.8rem; border-radius: 0.8rem; padding: 0 0.6rem;
    border: 0.25rem dashed var(--orange); background: #fffaf0; color: var(--orange); }
  .gap.filled { border-style: solid; border-color: var(--green); background: #d9f7e8; color: #117a4a; animation: pop 0.35s; }
  .gap.nope { border-color: var(--red); background: #ffe1e3; animation: shake 0.4s; }
  .bank { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin: 1.4rem 0 0.4rem; }
  .chip { border: 0; border-radius: 1rem; background: var(--blue); color: #fff; font-family: var(--read); font-size: 2.4rem; font-weight: 700;
    padding: 0.5rem 1.4rem; min-height: 4.4rem; box-shadow: 0 0.35rem 0 rgba(0, 0, 0, 0.2); }
  .chip.used { visibility: hidden; }
  /* each animal moves its own way once matched */
  .go-trots { animation: trot 0.5s 4; } .go-leaps { animation: leap 0.7s 3; } .go-crawls { animation: crawl 1.2s 2; }
  .go-runs { animation: run 0.4s 5; } .go-swings { animation: swing 0.8s 3; transform-origin: top center; }
  @keyframes trot { 50% { transform: translateY(-0.6rem); } }
  @keyframes leap { 50% { transform: translateY(-2.4rem) rotate(-10deg); } }
  @keyframes crawl { 50% { transform: translateX(1.4rem) scaleX(1.15); } }
  @keyframes run { 50% { transform: translateX(1rem); } }
  @keyframes swing { 25% { transform: rotate(18deg); } 75% { transform: rotate(-18deg); } }
  /* compact layout so the page fits one smartboard screen */
  .rowx { font-size: 2rem !important; padding: 0.2rem 1rem !important; }
  .rowx .e { font-size: 3rem !important; }
  .gap { height: 3.6rem !important; min-width: 13rem !important; }
  .chip { font-size: 2rem !important; min-height: 3.6rem !important; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint">Match the fruits to the tree they grow on. Drag the tree to the gap (or tap it, then tap the gap).</p>
  <div class="rows" id="rows"></div>
  <div class="bank" id="bank"></div>
  <div class="feedback" id="fb"></div>
  <button class="big-btn ghost" id="reset">🔁 Start again</button>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Fruits and Trees', subtitle: 'We are all Indians · Match', back: '../index.html#ch13' });

const ITEMS = [
  { n: 'banana', p: 'Bananas', e: '🍌', v: 'banana tree' }, { n: 'coconut', p: 'Coconuts', e: '🥥', v: 'coconut tree' }, { n: 'apple', p: 'Apples', e: '🍎', v: 'apple tree' },
  { n: 'grapes', p: 'Grapes', e: '🍇', v: 'grapevine' }, { n: 'mango', p: 'Mangoes', e: '🥭', v: 'mango tree' },
];

function build() {
  let done = 0;
  G.$('#fb').textContent = '';
  G.$('#rows').innerHTML = G.shuffle(ITEMS).map((it) => `<div class="rowx"><span class="e">${it.e}</span><span>${it.n} →</span>
    <span class="gap" data-v="${it.v}">?</span></div>`).join('');
  G.$('#bank').innerHTML = G.shuffle(ITEMS).map((it) => `<button class="chip" data-w="${it.v}">${it.v}</button>`).join('');
  G.$$('.chip').forEach((c) => c.addEventListener('click', () => G.say(c.dataset.w)));
  G.tapDrag(G.$$('.chip'), G.$$('.gap'), (chip, gap) => {
    if (gap.classList.contains('filled')) return;
    if (chip.dataset.w === gap.dataset.v) {
      gap.classList.add('filled');
      gap.textContent = chip.dataset.w;
      chip.classList.add('used');
      chip.dataset.locked = 1;
      
      G.sfx('good');
      G.star();
      { const it = ITEMS.find((x) => x.v === chip.dataset.w); G.say(`${it.p} grow on ${(/^[aeiou]/.test(it.v) ? 'an ' : 'a ') + it.v}.`); }
      if (++done === ITEMS.length) setTimeout(() => G.end({ title: 'Well done!', msg: 'Trees give us fruits. Let us take care of trees! 🌳', onReplay: build }), 1800);
    } else {
      gap.classList.add('nope');
      G.sfx('bad');
      G.feedback(G.$('#fb'), false, '🙂 Try again!');
      setTimeout(() => gap.classList.remove('nope'), 500);
    }
  });
}
G.$('#reset').onclick = build;
build();
</script>
</body>
</html>
