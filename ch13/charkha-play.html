<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .scene-head { display: flex; align-items: center; gap: 1rem; justify-content: center; margin-bottom: 0.5rem; }
  .scene-head .pic { font-size: 3.6rem; line-height: 1; }
  .scene-head .t { font-size: 2.2rem; font-weight: 800; }
  .lines { display: flex; flex-direction: column; gap: 0.35rem; width: 100%; max-width: 90rem; }
  .ln { display: flex; align-items: center; gap: 1rem; border-radius: 1.4rem; padding: 0.15rem 1rem; border: 0.25rem solid var(--line); background: #fff; box-shadow: var(--shadow); text-align: left; }
  .ln .who { font-size: 2.2rem; min-width: 7rem; line-height: 1; flex: none; text-align: center; }
  .ln .who small { display: block; font-size: 1.2rem; font-weight: 800; }
  .ln .txt { font-family: var(--read); font-size: 1.7rem; flex: 1; }
  .ln.now { box-shadow: 0 0 0 0.4rem var(--yellow); }
  .nav { margin-top: 0.9rem; }
  .props { font-size: 1.3rem; color: var(--muted); margin-top: 0.6rem; }
  /* compact layout so the page fits one smartboard screen */
  .ln .txt { font-size: 1.5rem !important; }
  .ln .who { font-size: 1.8rem !important; }
  .ln .who { display: flex !important; align-items: center; gap: 0.4rem; min-width: 13rem !important; text-align: left !important; }
  .ln .who small { display: inline !important; font-size: 1.3rem !important; }
  .ln { padding: 0.2rem 1rem !important; }
  .scene-head .pic { font-size: 2.6rem !important; }
  .scene-head .t { font-size: 1.8rem !important; }
  .props { font-size: 1.1rem !important; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint" style="margin-bottom:0.5rem">Read the play “Something New” in parts. Choose who is Anshika, Zoya, Rohan, Tejas, Bhavya, Pamyo, Simran and the Teacher. Tap a line to hear it.</p>
  <div class="card center" style="width:100%;max-width:96rem">
    <div class="progress" id="pg"></div>
    <div class="scene-head"><span class="pic" id="pic"></span><span class="t" id="title"></span></div>
    <div class="lines" id="lines"></div>
    <div class="row nav">
      <button class="big-btn ghost" id="prev">◀ Back</button>
      <button class="big-btn orange" id="play">🔊 Hear the scene</button>
      <button class="big-btn green" id="clap">👏 Great acting!</button>
      <button class="big-btn ghost" id="next">Next ▶</button>
    </div>
    <div class="props">🧵 The charkha (spinning wheel) was very dear to Mahatma Gandhi. He used it to spin thread.</div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Something New', subtitle: 'We are all Indians · A play', back: '../index.html#ch13' });

/* The play from the book, in three scenes. */
const SCENES = [
  { pic: '🏫', t: 'Scene 1 · Something on the table', l: [
    ['anshika', 'Hey! Look at this!'], ['zoya', 'Does it belong to our teacher?'], ['rohan', 'But what is it?'],
    ['tejas', 'It looks like a bicycle to me but it has only one wheel.'], ['bhavya', 'And it has no handle.'],
    ['pamyo', 'There are no pedals as well.'], ['simran', 'And it is made of wood.'], ['bhavya', 'Why is there a thread on it?'],
    ['zoya', 'I do not know. Maybe we should ask the teacher.']] },
  { pic: '👩‍🏫', t: 'Scene 2 · The teacher comes in', l: [
    ['all', 'Namaste, Teacher.'], ['pamyo', 'Ma’am, what is this?'], ['teacher', 'Do you know about Mahatma Gandhi? Do you know who he was?'],
    ['zoya', 'Ma’am, Mahatma Gandhi is the Father of the nation.'], ['teacher', 'Right! Gandhiji led the Indian Freedom movement.'],
    ['anshika', 'Gandhiji also gave the message of non-violence and peaceful existence.']] },
  { pic: '🧵', t: 'Scene 3 · The Charkha', l: [
    ['simran', 'But what about that?'], ['teacher', 'This object was very dear to Mahatma Gandhi. It is called the Charkha or Spinning wheel.'],
    ['rohan', 'What is it used for, ma’am?'], ['teacher', 'Mahatma Gandhi used it to spin thread. This handkerchief is made of the thread that is spun on charkha.'],
    ['teacher', 'Today, a guest will join us. He will show you how to spin the charkha.'], ['all', '(All children clap with joy.) 👏👏👏']] },
];
const WHO = {
  anshika: ['👧🏽', 'Anshika', '#ff6fa8'], zoya: ['👧🏻', 'Zoya', '#8a5cf6'], rohan: ['👦🏽', 'Rohan', '#2f7de1'], tejas: ['👦🏻', 'Tejas', '#13b5b1'],
  bhavya: ['👧🏾', 'Bhavya', '#ff8a3d'], pamyo: ['👦🏾', 'Pamyo', '#2bb673'], simran: ['👧🏽', 'Simran', '#e63946'],
  teacher: ['👩‍🏫', 'Teacher', '#8b5a2b'], all: ['🧒🧒🧒', 'Everyone', '#6b6280'],
};
let s = 0, token = 0;
const clean = (t) => t.replace(/[👏]/gu, '').trim();

function draw() {
  token++;
  speechSynthesis.cancel();
  const sc = SCENES[s];
  G.progress(G.$('#pg'), s, SCENES.length);
  G.$('#pic').textContent = sc.pic;
  G.$('#title').textContent = sc.t;
  G.$('#lines').innerHTML = sc.l.map(([w, t], i) => `<button class="ln" data-i="${i}" style="border-color:${WHO[w][2]}"><span class="who">${WHO[w][0]}<small style="color:${WHO[w][2]}">${WHO[w][1]}</small></span><span class="txt">${t}</span></button>`).join('');
  G.$$('.ln').forEach((b) => (b.onclick = () => { token++; mark(b); G.say(clean(sc.l[b.dataset.i][1])); }));
  G.$('#clap').disabled = false;
}
function mark(b) { G.$$('.ln').forEach((x) => x.classList.toggle('now', x === b)); }
function playFrom(i, my) {
  const all = G.$$('.ln');
  if (my !== token || i >= all.length) { mark(null); return; }
  mark(all[i]);
  G.say(clean(SCENES[s].l[i][1]), { onend: () => setTimeout(() => playFrom(i + 1, my), 500) });
}

G.$('#play').onclick = () => { token++; playFrom(0, token); };
G.$('#prev').onclick = () => { s = (s + SCENES.length - 1) % SCENES.length; draw(); };
G.$('#next').onclick = () => {
  if (s === SCENES.length - 1) { G.end({ title: '👏 Bravo!', msg: 'You read the whole play.', onReplay: () => { s = 0; draw(); } }); return; }
  s++; draw();
};
G.$('#clap').onclick = (e) => { G.star(2); G.sfx('win'); G.confetti(20); G.say('Great acting!'); e.currentTarget.disabled = true; };
draw();
</script>
</body>
</html>
