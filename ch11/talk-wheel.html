<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap { display: grid; grid-template-columns: auto 1fr; gap: 2rem; align-items: center; }
  .wheel-box { position: relative; width: min(34rem, 42vw); aspect-ratio: 1; }
  .pointer { position: absolute; top: -1.2rem; left: 50%; transform: translateX(-50%); font-size: 3.4rem; z-index: 2; }
  #wheel { width: 100%; height: 100%; transition: transform 4s cubic-bezier(.17, .67, .2, 1); }
  .spin { position: absolute; inset: 0; margin: auto; width: 8rem; height: 8rem; border-radius: 50%; border: 0.4rem solid #fff;
    background: var(--ink); color: #fff; font-size: 1.7rem; font-weight: 800; box-shadow: var(--shadow); }
  .qcard { min-height: 22rem; display: flex; flex-direction: column; justify-content: center; gap: 1rem; }
  .qcard .emo { font-size: 6rem; line-height: 1; }
  .qcard .qq { font-family: var(--read); font-size: 2.3rem; font-weight: 700; }
  .qcard .starter { font-family: var(--read); font-size: 2rem; background: #fff4cc; border-radius: 1rem; padding: 0.6rem 1rem; }
  .qcard .tip { font-size: 1.3rem; color: var(--muted); }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; justify-items: center; } .wheel-box { width: 80vw; } }
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <div class="wheel-box">
      <div class="pointer">🔻</div>
      <svg id="wheel" viewBox="-100 -100 200 200"></svg>
      <button class="spin" id="spin">SPIN</button>
    </div>
    <div class="card qcard center" id="q">
      <div class="emo">🎡</div>
      <div class="qq">Spin the wheel!</div>
      <div class="tip">Answer the question in English. Use the helper sentence.</div>
    </div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Talk Wheel', subtitle: 'The Smart Monkey · Let us speak', back: '../index.html#ch11' });

const QS = [
  { e: '🚮', q: 'Have you seen people throwing packets or bottles in the park or on the road? Talk about it.', s: 'Yes, I saw ________. It is not good.', c: '#e63946' },
  { e: '🍪', q: 'After having biscuits, what do you do with the wrapper?', s: 'I put the wrapper in the ________.', c: '#2f7de1' },
  { e: '🌳', q: 'Imagine you are sitting under a tree. What do you see on the tree?', s: 'I see ________ on the tree.', c: '#2bb673' },
  { e: '🗑️', q: 'Is there a dustbin in your school? Do you know where it is?', s: 'Yes, the dustbin is ________.', c: '#ff8a3d' },
  { e: '🛒', q: 'Have you gone to a nearby shop with your family? What did you see?', s: 'I went to the shop with my ________. I saw ________.', c: '#8a5cf6' },
  { e: '🐒', q: 'Why is the monkey smart?', s: 'The monkey is smart because ________.', c: '#13b5b1' },
];
const wheel = G.$('#wheel');
const N = QS.length, A = 360 / N;
const pt = (deg, r) => [r * Math.sin((deg * Math.PI) / 180), -r * Math.cos((deg * Math.PI) / 180)];
wheel.innerHTML = QS.map((q, i) => {
  const [x1, y1] = pt(i * A, 98), [x2, y2] = pt((i + 1) * A, 98), [tx, ty] = pt(i * A + A / 2, 62);
  return `<path d="M0 0 L${x1} ${y1} A98 98 0 0 1 ${x2} ${y2} Z" fill="${q.c}" stroke="#fff" stroke-width="2"/>
    <text x="${tx}" y="${ty}" font-size="26" text-anchor="middle" dominant-baseline="central">${q.e}</text>
    <text x="${pt(i * A + A / 2, 85)[0]}" y="${pt(i * A + A / 2, 85)[1]}" font-size="10" fill="#fff" font-weight="800" text-anchor="middle" dominant-baseline="central">${i + 1}</text>`;
}).join('');

let angle = 0, busy = false;
const asked = new Set();
G.$('#spin').onclick = () => {
  if (busy) return;
  busy = true;
  let pick;
  do { pick = Math.floor(Math.random() * N); } while (asked.size < N && asked.has(pick));
  asked.add(pick);
  if (asked.size === N) asked.clear();
  // Rotate so that the middle of slice `pick` lands under the pointer (top).
  const target = 360 - (pick * A + A / 2);
  angle += 360 * 5 + ((target - (angle % 360)) + 360) % 360;
  wheel.style.transform = `rotate(${angle}deg)`;
  let t = 0;
  const tick = setInterval(() => { G.sfx('pop'); if (++t > 14) clearInterval(tick); }, 220);
  setTimeout(() => {
    busy = false;
    const q = QS[pick];
    G.$('#q').innerHTML = `<div class="emo">${q.e}</div><div class="qq">${q.q}</div>
      <div class="starter">💬 ${q.s}</div>
      <div class="row"><button class="say" id="sayq">🔊</button>
      <button class="big-btn green" id="good">⭐ Good answer!</button></div>`;
    G.say(q.q);
    G.$('#sayq').onclick = () => G.say(q.q);
    G.$('#good').onclick = (e) => { G.star(); G.sfx('good'); G.confetti(15); e.currentTarget.disabled = true; };
  }, 4100);
};
</script>
</body>
</html>
