<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .q .e { font-size: 7rem; line-height: 1; }
  .q .st { font-family: var(--read); font-size: 3rem; margin: 0.6rem 0 1.4rem; }
  .choice { font-size: 5rem; min-width: 12rem; min-height: 9rem; }
  .choice.tick { color: var(--green); }
  .choice.cross { color: var(--red); }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint">Is the sentence correct? Tap ✓ for correct and ✘ for incorrect.</p>
  <div class="card" id="game" style="width:100%;max-width:76rem"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Tick or Cross', subtitle: 'The Smart Monkey · Let us write · A', back: '../index.html#ch11' });

/* The five sentences from the book. */
const ITEMS = [
  { e: '🏫', s: 'Anju and Farida went to their school.', ok: false, fix: 'They went to the <b>market</b>.' },
  { e: '👜', s: 'Anju bought a bag and Farida bought a water bottle.', ok: true, fix: 'Yes!' },
  { e: '🐦', s: 'There was a bird on the branch of the tree.', ok: false, fix: 'There was a <b>monkey</b> on the branch.' },
  { e: '🍌', s: 'The monkey had a banana.', ok: true, fix: 'He peeled it and ate it.' },
  { e: '🗑️', s: 'The monkey threw the banana peel in the dustbin.', ok: true, fix: 'What a smart monkey!' },
];

G.quiz({
  el: G.$('#game'),
  items: ITEMS,
  shuffleItems: false,
  question: (it) => `<div class="e">${it.e}</div><div class="st">${it.s}</div>`,
  options: () => [{ label: '✓', value: true }, { label: '✘', value: false }],
  answer: (it) => it.ok,
  onShow: (it, el) => {
    const [t, c] = G.$$('.choice', el);
    t.classList.add('tick'); c.classList.add('cross');
    G.say(it.s);
  },
  explain: (it) => it.fix,
  endMsg: 'You checked all the sentences!',
});
</script>
</body>
</html>
