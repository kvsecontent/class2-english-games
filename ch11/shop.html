<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .wrap { display: grid; grid-template-columns: 1fr 30rem; gap: 1.2rem; width: 100%; max-width: 120rem; align-items: start; }
  .shop { background: #fff7e6; border: 0.3rem solid #e0b86a; border-radius: var(--radius); padding: 1rem; }
  .shop h3 { margin: 0 0 0.6rem; text-align: center; font-size: 2rem; }
  .shelf { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.6rem; padding-bottom: 0.8rem; border-bottom: 0.6rem solid #c48a3a; margin-bottom: 0.8rem; }
  .item { background: #fff; border: 0.2rem solid var(--line); border-radius: 1rem; padding: 0.4rem; display: flex; flex-direction: column; align-items: center; font-family: var(--read); font-size: 1.4rem; font-weight: 700; }
  .item .e { font-size: 3.6rem; line-height: 1.1; }
  .item.in { opacity: 0.35; }
  .side { display: flex; flex-direction: column; gap: 0.8rem; }
  .basket { min-height: 7rem; background: #fdf1d6; border: 0.3rem dashed #c48a3a; border-radius: 1.4rem; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; justify-content: center; font-size: 3.4rem; padding: 0.4rem; }
  .who { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; }
  .who button { font-size: 1.3rem; min-height: 3.2rem; min-width: 0; padding: 0.2rem 0.8rem; }
  .who button.on { background: var(--pink); color: #fff; }
  .story { font-family: var(--read); font-size: 1.4rem; min-height: 4rem; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } .shelf { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint">Have you gone to a nearby shop with your family? Let’s go shopping! Tap things you like to put them in your basket. Then share with the class.</p>
  <div class="wrap">
    <div class="shop"><h3>🏪 Our Shop</h3><div id="shelves"></div></div>
    <div class="side card">
      <b style="font-size:1.5rem">🧺 My basket</b>
      <div class="basket" id="basket"></div>
      <b style="font-size:1.4rem">I went with my…</b>
      <div class="who" id="who"></div>
      <div class="story" id="story">💬 Pick things and a family member.</div>
      <div class="row"><button class="big-btn green" id="tell">🔊 Tell the class</button><button class="big-btn ghost" id="reset">🔁</button></div>
    </div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Going Shopping', subtitle: 'The Smart Monkey · Project work', back: '../index.html#ch11' });

const ITEMS = [
  ['🍎', 'apples'], ['🍌', 'bananas'], ['🍞', 'bread'], ['🥛', 'milk'], ['🥜', 'groundnuts'], ['🧃', 'juice'],
  ['👜', 'a bag'], ['🍶', 'a water bottle'], ['🍪', 'biscuits'], ['🧸', 'a toy'], ['🖍️', 'crayons'], ['🎈', 'balloons'],
];
const WHO = ['mother', 'father', 'grandmother', 'grandfather', 'sister', 'brother', 'aunt', 'uncle'];
let picked = [], who = '';

G.$('#shelves').innerHTML = [0, 6].map((k) => `<div class="shelf">${ITEMS.slice(k, k + 6).map(([e, n]) => `<button class="item" data-n="${n}"><span class="e">${e}</span>${n}</button>`).join('')}</div>`).join('');
G.$('#who').innerHTML = WHO.map((w) => `<button class="big-btn ghost" data-w="${w}">${w}</button>`).join('');
const list = (a) => (a.length > 1 ? a.slice(0, -1).join(', ') + ' and ' + a.at(-1) : a[0] || '');
function story() {
  const s = (who ? `I went to the shop with my ${who}. ` : '') + (picked.length ? `I liked ${list(picked.map((p) => p[1]))}.` : '');
  G.$('#story').textContent = s ? '💬 ' + s : '💬 Pick things and a family member.';
  return s;
}
G.$$('.item').forEach((b) => (b.onclick = () => {
  const it = ITEMS.find((x) => x[1] === b.dataset.n);
  if (b.classList.contains('in')) { picked = picked.filter((p) => p !== it); b.classList.remove('in'); }
  else { if (picked.length >= 4) { G.say('Your basket is full!'); return; } picked.push(it); b.classList.add('in'); G.sfx('pop'); G.say(it[1]); }
  G.$('#basket').textContent = picked.map((p) => p[0]).join('');
  story();
}));
G.$$('#who button').forEach((b) => (b.onclick = () => { who = b.dataset.w; G.$$('#who button').forEach((x) => x.classList.toggle('on', x === b)); story(); }));
G.$('#tell').onclick = () => { const s = story(); if (!s) return; G.say(s); if (who && picked.length) { G.star(2); G.confetti(12); } };
G.$('#reset').onclick = () => { picked = []; who = ''; G.$$('.item').forEach((b) => b.classList.remove('in')); G.$$('#who button').forEach((x) => x.classList.remove('on')); G.$('#basket').textContent = ''; story(); };
</script>
</body>
</html>
