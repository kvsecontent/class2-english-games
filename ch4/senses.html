<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .modes { margin-bottom: 1rem; }
  .play { display: grid; grid-template-columns: 22rem 1fr; gap: 1.4rem; width: 100%; max-width: 100rem; align-items: start; }
  .mystery { display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
  .mystery .face { font-size: 6.5rem; line-height: 1; position: relative; }
  .mystery .face .scarf { position: absolute; left: 50%; top: 36%; transform: translateX(-50%); width: 80%; height: 1.6rem; background: var(--purple); border-radius: 0.8rem; }
  .mystery .box { font-size: 5rem; width: 11rem; height: 11rem; border-radius: 1.6rem; background: #fff4cc; display: flex; align-items: center; justify-content: center; border: 0.3rem dashed var(--orange); }
  .mystery .box.open { background: #d9f7e8; border: 0.3rem solid var(--green); animation: pop 0.4s; }
  .senses { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; margin-bottom: 1rem; }
  .sense { border: 0.25rem solid var(--line); background: #fff; border-radius: 1.2rem; padding: 0.5rem 1rem; font-size: 1.7rem; font-weight: 800; display: flex; align-items: center; gap: 0.6rem; min-height: 4.6rem; box-shadow: var(--shadow); }
  .sense span { font-size: 2.6rem; }
  .sense[disabled] { opacity: 0.4; }
  .clues { font-family: var(--read); font-size: 2rem; min-height: 6rem; display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.8rem; }
  .clues div { background: #e7f1ff; border-radius: 0.8rem; padding: 0.3rem 0.8rem; animation: pop 0.3s; }
  .choice { font-family: var(--read); font-size: 2.2rem; }
  .q .e { font-size: 5rem; line-height: 1; }
  .q .t { font-family: var(--read); font-size: 2.4rem; margin: 0.4rem 0 1rem; }
  @media (max-width: 900px) { .play { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="stage center">
  <div class="row modes">
    <button class="big-btn purple" id="mPlay">🧣 Play Ava’s game</button>
    <button class="big-btn orange" id="mQuiz">🤔 How did she know?</button>
  </div>
  <div id="area" style="width:100%" class="center"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Guess Without Seeing', subtitle: 'Seeing without Seeing · Using our senses', back: '../index.html#ch4' });

const SENSES = { touch: ['✋', 'Touch it', 'Touching'], smell: ['👃', 'Smell it', 'Smelling'], hear: ['👂', 'Hear it', 'Listening'], taste: ['👅', 'Taste it', 'Tasting'] };
/* The first three are from the story. Clues only for senses that help. */
const THINGS = [
  { w: 'a rose', e: '🌹', c: { touch: 'It is something soft.', smell: 'It smells sweet, like a flower.' }, o: ['a rose', 'a ball', 'a bell'] },
  { w: 'a bell', e: '🔔', c: { hear: 'Trin… trin… It has a musical sound.', touch: 'It is small and hard.' }, o: ['a bell', 'a rose', 'a spoon'] },
  { w: 'orange juice', e: '🧃', c: { touch: 'It is a glass. My finger gets wet.', taste: 'It is sweet. It is not water.' }, o: ['orange juice', 'water', 'milk'] },
  { w: 'sugar', e: '🍬', c: { taste: 'It is very sweet.', touch: 'It is like tiny grains.' }, o: ['sugar', 'salt', 'sand'] },
  { w: 'a lemon', e: '🍋', c: { smell: 'It smells fresh.', taste: 'It is very sour!' }, o: ['a lemon', 'a mango', 'a banana'] },
  { w: 'ice', e: '🧊', c: { touch: 'It is very cold and wet.' }, o: ['ice', 'a stone', 'bread'] },
  { w: 'a drum', e: '🥁', c: { hear: 'Dhum! Dhum! Dhum!', touch: 'It is round.' }, o: ['a drum', 'a bell', 'a book'] },
  { w: 'a feather', e: '🪶', c: { touch: 'It is very light and soft.' }, o: ['a feather', 'a pencil', 'a stone'] },
];
const area = G.$('#area');

function play() {
  let list = G.shuffle(THINGS), i = 0;
  function round() {
    if (i >= list.length) { G.end({ title: 'Super senses!', msg: 'You found things without seeing them.', onReplay: play }); return; }
    const it = list[i];
    let firstTry = true;
    area.innerHTML = `<div class="progress" id="pg"></div>
      <div class="play">
        <div class="mystery"><div class="face">👧🏽<span class="scarf"></span></div><div class="box" id="box">❓</div></div>
        <div class="card">
          <div class="prompt" style="font-size:1.8rem;margin-top:0">What do I hold? Find out without seeing!</div>
          <div class="senses">${Object.entries(SENSES).map(([k, [ic, t]]) => `<button class="sense" data-k="${k}"><span>${ic}</span>${t}</button>`).join('')}</div>
          <div class="clues" id="clues"></div>
          <div class="row" id="opts"></div>
          <div class="feedback" id="fb"></div>
        </div>
      </div>`;
    G.progress(G.$('#pg'), i, list.length);
    G.say('What do I hold? Touch it, smell it, hear it or taste it.');
    G.$$('.sense').forEach((b) => (b.onclick = () => {
      const k = b.dataset.k;
      b.disabled = true;
      const clue = it.c[k] || `${SENSES[k][2]} does not help. Try another way!`;
      G.$('#clues').insertAdjacentHTML('beforeend', `<div>${SENSES[k][0]} ${clue}</div>`);
      if (/Trin/.test(clue)) G.sfx('trin');
      G.say(clue.replace(/…/g, ','));
    }));
    G.shuffle(it.o).forEach((o) => {
      const b = document.createElement('button');
      b.className = 'choice';
      b.textContent = o;
      b.onclick = () => {
        if (o === it.w) {
          b.classList.add('right');
          G.$$('.choice').forEach((x) => (x.disabled = true));
          const box = G.$('#box'); box.textContent = it.e; box.classList.add('open');
          if (firstTry) G.star();
          G.sfx('good');
          G.feedback(G.$('#fb'), true, `🎉 Yes! It is ${it.w}.`);
          G.say(`Yes! It is ${it.w}.`);
          i++;
          setTimeout(round, 2400);
        } else {
          firstTry = false;
          b.classList.add('wrong');
          G.sfx('bad');
          G.feedback(G.$('#fb'), false, '🙂 Use another sense and try again!');
          setTimeout(() => b.classList.remove('wrong'), 500);
        }
      };
      G.$('#opts').append(b);
    });
  }
  round();
}

function quiz() {
  area.innerHTML = `<div class="card" id="game" style="width:100%;max-width:76rem"></div>`;
  const OPTS = [['👆 by touching', 'touch'], ['👃 by smelling', 'smell'], ['👂 by hearing', 'hear'], ['👅 by tasting', 'taste'], ['👀 by seeing', 'see']];
  const ITEMS = [
    { e: '🌸', t: 'How did Onshangla know it was a flower?', a: 'touch', x: 'She touched it. It was soft.' },
    { e: '🌹', t: 'How did Onshangla know it was a rose?', a: 'smell', x: 'She sniffed at it.' },
    { e: '🔔', t: 'How did Onshangla know it was a bell?', a: 'hear', x: 'She heard the musical sound.' },
    { e: '🥛', t: 'How did Onshangla know it was a glass?', a: 'touch', x: 'She touched it.' },
    { e: '🍊', t: 'How did Onshangla know it was orange juice?', a: 'taste', x: 'She tasted it.' },
    { e: '👩🏽', t: 'How did Onshangla know it was Ava at the end?', a: 'see', x: 'Ava removed the scarf. She saw her.' },
  ];
  G.quiz({
    el: G.$('#game'),
    items: ITEMS,
    shuffleItems: false,
    question: (it) => `<div class="e">${it.e}</div><div class="t">${it.t}</div>`,
    options: () => OPTS.map(([label, value]) => ({ label, value })),
    answer: (it) => it.a,
    onShow: (it) => G.say(it.t),
    explain: (it) => it.x,
    endMsg: 'We can find out things with our hands, nose, ears, tongue and eyes!',
  });
}

G.$('#mPlay').onclick = play;
G.$('#mQuiz').onclick = quiz;
play();
</script>
</body>
</html>
