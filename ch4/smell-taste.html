<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .studio { display: grid; grid-template-columns: 9.4rem 1fr 1fr; gap: 1rem; height: calc(100vh - 12.5rem); }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; align-content: start; justify-items: center; }
  .sw { width: 3.8rem; height: 3.8rem; border-radius: 50%; border: 0.3rem solid #fff; box-shadow: 0 0 0 0.2rem var(--line); flex: none; }
  .sw.on { box-shadow: 0 0 0 0.35rem var(--ink); }
  .tool { width: 4.2rem; height: 4rem; border-radius: 1rem; border: 0.2rem solid var(--line); background: #fff; font-size: 2rem; flex: none; }
  .tool.on { background: #fff4cc; border-color: var(--yellow); }
  .panel { display: flex; flex-direction: column; gap: 0.5rem; min-height: 0; }
  .panel h3 { margin: 0; font-size: 1.8rem; text-align: center; }
  .stamps { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; }
  .stamps button { font-size: 2.2rem; width: 4.2rem; height: 4.2rem; border-radius: 0.8rem; border: 0.2rem solid var(--line); background: #fff; }
  .stamps button.on { background: #fff4cc; border-color: var(--yellow); }
  .canvas-box { position: relative; flex: 1; background: #fff; border-radius: var(--radius); border: 0.25rem solid var(--line); overflow: hidden; touch-action: none; }
  .smell .canvas-box { border-color: #ffb3d1; } .taste .canvas-box { border-color: #ffd08a; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .say-box { font-family: var(--read); font-size: 1.5rem; text-align: center; }
  @media (max-width: 900px) { .studio { grid-template-columns: 1fr; height: auto; } .canvas-box { height: 24rem; } }
</style>
</head>
<body>
<main class="stage" style="max-width:none;padding-top:0.8rem">
  <p class="hint" style="text-align:center;margin-bottom:0.6rem">Draw two things you like to <b>smell</b> and two things you like to <b>taste</b>. Use the pen, or tap a picture and then tap the box.</p>
  <div class="studio">
    <div class="tools" id="tools"></div>
    <div class="panel smell">
      <h3>👃 I like to smell…</h3>
      <div class="stamps" data-for="smell"></div>
      <div class="canvas-box"><canvas data-k="smell"></canvas></div>
    </div>
    <div class="panel taste">
      <h3>👅 I like to taste…</h3>
      <div class="stamps" data-for="taste"></div>
      <div class="canvas-box"><canvas data-k="taste"></canvas></div>
    </div>
  </div>
  <div class="row" style="margin-top:0.6rem">
    <div class="say-box">💬 Share with your friend: “I like to smell <b>roses</b>. I like to taste <b>mangoes</b>.”</div>
    <button class="big-btn green" id="done">⭐ I finished!</button>
  </div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Smell and Taste', subtitle: 'Seeing without Seeing · Let us draw and share', back: '../index.html#ch4' });

const COLORS = ['#2b2140', '#e63946', '#ff8a3d', '#ffc93c', '#2bb673', '#2f7de1', '#8a5cf6', '#ff6fa8', '#8b5a2b'];
let color = COLORS[1], size = 8, mode = 'pen', stamp = null;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

G.$('#tools').innerHTML = COLORS.map((c, i) => `<button class="sw ${i === 1 ? 'on' : ''}" data-c="${c}" style="background:${c}"></button>`).join('') +
  `<button class="tool on" data-m="pen">✏️</button><button class="tool" data-m="fat">🖌️</button><button class="tool" data-m="eraser">🧽</button><button class="tool" id="clear">🗑️</button>`;
const STAMPS = { smell: ['🌹', '🌸', '🌼', '🍋', '☕', '🍞', '🧼', '🌿', '🌧️'], taste: ['🥭', '🍎', '🍌', '🍉', '🍦', '🍫', '🍪', '🍊', '🍯'] };
G.$$('.stamps').forEach((s) => (s.innerHTML = STAMPS[s.dataset.for].map((e) => `<button data-s="${e}">${e}</button>`).join('')));

function setTool(m, b) {
  mode = m; stamp = null;
  size = m === 'fat' ? 22 : m === 'eraser' ? 40 : 8;
  G.$$('.tool, .stamps button').forEach((x) => x.classList.toggle('on', x === b));
}
G.$('#tools').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'clear') { if (confirm('Clear both drawings?')) pads.forEach((p) => p.ctx.clearRect(0, 0, p.cv.width, p.cv.height)); return; }
  if (b.dataset.c) { color = b.dataset.c; G.$$('.sw').forEach((x) => x.classList.toggle('on', x === b)); if (mode === 'eraser' || mode === 'stamp') setTool('pen', G.$('[data-m=pen]')); return; }
  setTool(b.dataset.m, b);
});
G.$$('.stamps').forEach((s) => s.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  setTool('stamp', b);
  stamp = b.dataset.s;
  G.sfx('pop');
}));

const pads = G.$$('canvas').map((cv) => ({ cv, ctx: cv.getContext('2d'), box: cv.parentElement }));
function fit() {
  pads.forEach(({ cv, ctx, box }) => {
    const keep = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
    cv.width = box.clientWidth * dpr; cv.height = box.clientHeight * dpr;
    if (keep) ctx.putImageData(keep, 0, 0);
  });
}
fit();
window.addEventListener('resize', fit);

pads.forEach(({ cv, ctx }) => {
  let last = null;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr]; };
  const line = (a, b) => {
    ctx.globalCompositeOperation = mode === 'eraser' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = color; ctx.lineWidth = size * dpr; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
  };
  cv.addEventListener('pointerdown', (e) => {
    const p = pos(e);
    if (mode === 'stamp' && stamp) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.font = `${80 * dpr}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(stamp, ...p);
      G.sfx('pop');
      return;
    }
    cv.setPointerCapture(e.pointerId);
    last = p;
    line(p, [p[0] + 0.1, p[1]]);
  });
  cv.addEventListener('pointermove', (e) => { if (!last) return; const p = pos(e); line(last, p); last = p; });
  const stop = () => (last = null);
  cv.addEventListener('pointerup', stop);
  cv.addEventListener('pointercancel', stop);
});

G.$('#done').onclick = () => { G.star(3); G.sfx('win'); G.confetti(); G.say('Lovely! Now tell your friend what you like to smell and taste.'); };
</script>
</body>
</html>
