<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .q .e { font-size: 7rem; line-height: 1; }
  .q .st { font-family: var(--read); font-size: 3rem; margin: 0.6rem 0 1.4rem; }
  .choice { font-size: 5rem; min-width: 12rem; min-height: 9rem; }
  .choice.tick { color: var(--green); }
  .choice.cross { color: var(--red); }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint">Our eyes do so much for us. Tap ✓ if it is good for our eyes. Tap ✘ if it is not good.</p>
  <div class="card" id="game" style="width:100%;max-width:76rem"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Care for Your Eyes', subtitle: 'Seeing without Seeing · Good for our eyes?', back: '../index.html#ch4' });

const ITEMS = [
  { e: '🧍📖', s: 'Sit straight while reading or drawing.', ok: true, fix: 'Good for our eyes!' },
  { e: '📺', s: 'Sit very close to the TV.', ok: false, fix: 'Not good. Sit far from the TV.' },
  { e: '☀️', s: 'Stare at the sun.', ok: false, fix: 'Never look at the sun!' },
  { e: '💡📖', s: 'Read in good light.', ok: true, fix: 'Good for our eyes!' },
  { e: '🥕🥦', s: 'Eat carrots and lots of vegetables.', ok: true, fix: 'Good for our eyes!' },
  { e: '📱⏰', s: 'Play for a long time on the mobile.', ok: false, fix: 'Not good. Rest your eyes.' },
  { e: '💦😌', s: 'Close eyes and splash water on eyelids.', ok: true, fix: 'Good for our eyes!' },
];

G.quiz({
  el: G.$('#game'),
  items: ITEMS,
  shuffleItems: false,
  question: (it) => `<div class="e">${it.e}</div><div class="st">${it.s}</div>`,
  options: () => [{ label: '✓', value: true }, { label: '✘', value: false }],
  answer: (it) => it.ok,
  onShow: (it, el) => {
    const [t, c] = G.$$('.choice', el);
    t.classList.add('tick'); c.classList.add('cross');
    G.say(it.s);
  },
  explain: (it) => it.fix,
  endMsg: 'Let us take care of our eyes!',
});
</script>
</body>
</html>
