<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .story-wrap { display: grid; grid-template-columns: 1fr 22rem; gap: 1.4rem; align-items: start; }
  .story { font-family: var(--read); font-size: 2.2rem; line-height: 1.6; }
  .story h2 { font-family: var(--head); font-size: 3rem; margin: 0 0 0.6rem; color: var(--red); text-align: center; }
  .page { margin: 0 0 1.2rem; padding: 0.6rem 1rem; border-radius: 1rem; display: grid; grid-template-columns: 7rem 1fr; gap: 1rem; align-items: start; }
  .page .pic { font-size: 4.2rem; line-height: 1.2; text-align: center; }
  .page.now { background: #fff4cc; }
  .line { border-radius: 0.6rem; padding: 0 0.2rem; transition: background 0.2s; }
  .line.now { background: #ffd34d; }
  .w { cursor: pointer; border-radius: 0.4rem; }
  .w:active { background: #cfe3ff; }
  .show-tags .w.sight { background: #d9f7e8; color: #117a4a; font-weight: 700; }
  .show-tags .w.new { background: #ffe1ec; color: #b4235a; font-weight: 700; }
  .side { display: flex; flex-direction: column; gap: 0.8rem; position: sticky; top: 6rem; }
  .side .big-btn { width: 100%; }
  .key { font-size: 1.1rem; display: flex; flex-direction: column; gap: 0.4rem; }
  .key span { padding: 0.2rem 0.6rem; border-radius: 0.5rem; display: inline-block; }
  .side .pic { font-size: 5rem; text-align: center; }
  @media (max-width: 900px) { .story-wrap { grid-template-columns: 1fr; } .side { position: static; } }
</style>
</head>
<body>
<main class="stage">
  <div class="story-wrap">
    <div class="card story" id="story"></div>
    <div class="side">
      <div class="pic">🧣👧🏽</div>
      <button class="big-btn green" id="readAll">▶ Read the story</button>
      <button class="big-btn orange" id="echo">🗣️ My turn, your turn</button>
      <button class="big-btn ghost" id="stop">⏹ Stop</button>
      <button class="big-btn purple" id="tags">🎨 Show special words</button>
      <div class="key card">
        <b>Tap any word to hear it.</b>
        <div><span style="background:#d9f7e8;color:#117a4a">Sight words</span> is, from, what, on, how, and, it, me, our, some, other</div>
        <div><span style="background:#ffe1ec;color:#b4235a">New words</span> quiet, front, sniff, remove, joy, blink, difficulties</div>
      </div>
    </div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Story Time: Seeing without Seeing', subtitle: 'Let us read', back: '../index.html#ch4' });

/* Each page is the book text; it is split into sentences for reading aloud. */
const PAGES = [
  { pic: '🎒<br>🚪', text: 'Little Onshangla returned from the school. She opened the door quietly. She kept her bag on the table quietly. Her mother looked at her. “Onshangla you are very quiet today,” said Ava. “Did anything happen in the school?”' },
  { pic: '👦🏽<br>🕶️', text: '“Yes Ava,” said Onshangla. “A new boy came to our school. He sits in our class.” “Yes?” said Ava, listening to Onshangla, and placing biscuits and milk on the table. “The teacher helped him sit in the front desk,” said Onshangla. “He wears black glasses. He cannot see. He will come every day. How will he do things?” “Finish your biscuits and milk,” said Ava. “Then we will play a new game.”' },
  { pic: '🧣<br>🌹', text: '“Yes, let us play,” said Onshangla. She tied a scarf over Onshangla’s eyes. “Now tell me what do I hold in my hand?” said Ava. “How can I?” asked Onshangla. “My eyes are closed. I can’t see.” “You can find out,” said Ava. “Try it.” Ava had a rose in her hand. “What do I hold?” she asked. Onshangla touched it. “It is something soft... a flower!” she said. “Yes,” said Ava. “But what flower is it? Smell it!” Onshangla bent forward and sniffed at it. “It is a rose!” she cried.' },
  { pic: '🔔<br>🎵', text: '“Good!” said Ava. “Now try another thing… What do I hold?” She held a small bell in her hand. She shook it. Trin… Trin… “I know,” said Onshangla, with joy. “It is the bell. The small bell that gives such a musical sound. I can hear it, Ava!” Onshangla took the bell and shook it herself. “Smart girl!” said Ava.' },
  { pic: '🥛<br>🍊', text: 'Then Ava took a glass in her hand. “What is it? What do I hold now? Do you know?” she asked. Onshangla touched it. “It is a glass,” she said. She put one finger slightly into the glass. “A glass of water!” “Are you sure?” asked Ava. “It could be milk or juice.” Onshangla tasted it. “Oh!” she cried, “It is not water, it is orange juice.” Ava laughed. “Good girl!” she said.' },
  { pic: '😊<br>🤝', text: '“Now I will remove the scarf. You must tell what is in front of you!” she said. She took off the scarf. Onshangla blinked and looked at her. “It is you, Ava,” she shouted with joy. “I see you!” “That was a wonderful game, Ava,” said Onshangla. “So, Onshangla” said Ava. “If a child cannot see, there are other ways of finding out things. But the child may have some difficulties. I hope all of you will be friends with the new boy.” “Yes, Ava,” said Onshangla.' },
].map((p) => ({ pic: p.pic, lines: p.text.split(/(?<=[.!?”])\s+(?=[“A-Z])/) }));
const SIGHT = ['is', 'from', 'what', 'on', 'how', 'and', 'it', 'me', 'our', 'some', 'other'];
const NEW = ['quiet', 'quietly', 'front', 'sniff', 'sniffed', 'remove', 'joy', 'blink', 'blinked', 'difficulties'];

const storyEl = G.$('#story');
storyEl.innerHTML = '<h2>Seeing without Seeing</h2>' + PAGES.map((p, s) => `<div class="page" data-s="${s}"><div class="pic">${p.pic}</div><div>` +
  p.lines.map((ln) => `<span class="line">` + ln.split(' ').map((w) => {
    const bare = w.toLowerCase().replace(/’s$/, '').replace(/[^a-z]/g, '');
    const cls = SIGHT.includes(bare) ? 'sight' : NEW.includes(bare) ? 'new' : '';
    return `<span class="w ${cls}" data-w="${bare}">${w}</span>`;
  }).join(' ') + '</span>').join(' ') + '</div></div>').join('');

storyEl.addEventListener('click', (e) => {
  const w = e.target.closest('.w');
  if (!w) return;
  stopAll();
  G.say(w.dataset.w, { rate: 0.7 });
});

const lines = G.$$('.line');
let token = 0;
function clearMarks() { G.$$('.now').forEach((e) => e.classList.remove('now')); }
function stopAll() { token++; speechSynthesis.cancel(); clearMarks(); }

function mark(i) {
  clearMarks();
  const ln = lines[i];
  ln.classList.add('now');
  ln.closest('.page').classList.add('now');
  ln.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* Read each sentence in turn. pauseMs > 0 leaves time for the class to repeat (echo reading). */
function readFrom(i, pauseMs) {
  const my = token;
  if (i >= lines.length) { clearMarks(); if (pauseMs) { G.star(3); G.confetti(20); } return; }
  mark(i);
  if (/Trin/.test(lines[i].textContent)) G.sfx('trin');
  G.say(lines[i].textContent.replace(/…/g, ', '), {
    rate: 0.75,
    onend: () => { if (my === token) setTimeout(() => readFrom(i + 1, pauseMs), pauseMs || 350); },
  });
}

G.$('#readAll').onclick = () => { stopAll(); readFrom(0, 0); };
G.$('#echo').onclick = () => { stopAll(); readFrom(0, 3200); };
G.$('#stop').onclick = stopAll;
G.$('#tags').onclick = () => storyEl.classList.toggle('show-tags');
</script>
</body>
</html>
