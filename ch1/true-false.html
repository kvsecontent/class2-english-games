<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .q .e { font-size: 7rem; line-height: 1; }
  .q .st { font-family: var(--read); font-size: 3rem; margin: 0.6rem 0 1.4rem; }
  .choice { font-size: 5rem; min-width: 12rem; min-height: 9rem; }
  .choice.tick { color: var(--green); }
  .choice.cross { color: var(--red); }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint">Is the sentence correct? Tap ✓ for correct and ✘ for incorrect.</p>
  <div class="card" id="game" style="width:100%;max-width:76rem"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Tick or Cross', subtitle: 'My Bicycle · Let us write · B' });

const ITEMS = [
  { e: '🚲', s: 'The child has a blue bicycle.', ok: false, fix: 'The child has a <b>red</b> bicycle.' },
  { e: '🔔', s: 'The bell goes trin... trin... trin.', ok: true, fix: 'The bell goes trin, trin, trin.' },
  { e: '🐇🐢', s: 'The child’s bicycle is always fast.', ok: false, fix: 'It is <b>sometimes fast, sometimes slow</b>.' },
  { e: '💧', s: 'The child needs some water to keep the bicycle moving.', ok: false, fix: 'The child needs some <b>air</b>.' },
  { e: '⛑️', s: 'The child puts on a little helmet while riding the bicycle.', ok: true, fix: 'A helmet keeps us safe.' },
];

G.quiz({
  el: G.$('#game'),
  items: ITEMS,
  shuffleItems: false,
  question: (it) => `<div class="e">${it.e}</div><div class="st">${it.s}</div>`,
  options: () => [{ label: '✓', value: true }, { label: '✘', value: false }],
  answer: (it) => it.ok,
  onShow: (it, el) => {
    const [t, c] = G.$$('.choice', el);
    t.classList.add('tick'); c.classList.add('cross');
    G.say(it.s.replace(/\.\.\./g, ','));
  },
  explain: (it) => it.fix,
  endMsg: 'You checked all the sentences!',
});
</script>
</body>
</html>
