<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .studio { display: grid; grid-template-columns: 7rem 1fr 22rem; gap: 1rem; height: calc(100vh - 7.5rem); }
  .tools { display: flex; flex-direction: column; gap: 0.6rem; align-items: center; overflow-y: auto; }
  .sw { width: 4.6rem; height: 4.6rem; border-radius: 50%; border: 0.3rem solid #fff; box-shadow: 0 0 0 0.2rem var(--line); flex: none; }
  .sw.on { box-shadow: 0 0 0 0.35rem var(--ink); }
  .tool { width: 5.2rem; height: 4.6rem; border-radius: 1rem; border: 0.2rem solid var(--line); background: #fff; font-size: 2rem; flex: none; }
  .tool.on { background: #fff4cc; border-color: var(--yellow); }
  .canvas-box { position: relative; background: #fff; border-radius: var(--radius); border: 0.25rem solid var(--line); overflow: hidden; touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ask { display: flex; flex-direction: column; gap: 0.8rem; }
  .ask .card { font-size: 1.6rem; font-weight: 700; }
  .ask .card.on { background: #fff4cc; border-color: var(--yellow); }
  .ask .card span { font-size: 2.4rem; }
</style>
</head>
<body>
<div class="studio stage" style="max-width:none;padding-top:0.8rem">
  <div class="tools" id="tools"></div>
  <div class="canvas-box" id="box"><canvas id="cv"></canvas></div>
  <div class="ask">
    <div class="prompt" style="font-size:1.6rem;margin:0">🪄 Imagine you have a magic bicycle!</div>
    <button class="card ask-q" data-q="Where would you go on your magic bicycle?"><span>🗺️</span> Where would you go?</button>
    <button class="card ask-q" data-q="What would you do there?"><span>🎈</span> What would you do there?</button>
    <button class="card ask-q" data-q="What would you see there?"><span>👀</span> What would you see there?</button>
    <button class="card ask-q" data-q="What magic can your bicycle do?"><span>✨</span> What magic can it do?</button>
    <div class="card" style="font-family:var(--read);font-size:1.4rem;font-weight:400">💬 My magic bicycle can <b>fly</b>. I would go to the <b>moon</b>. I would see the <b>stars</b>.</div>
    <button class="big-btn green" id="done">⭐ I finished!</button>
  </div>
</div>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'My Magic Bicycle', subtitle: 'My Bicycle · Let us think' });

const COLORS = ['#2b2140', '#e63946', '#ff8a3d', '#ffc93c', '#2bb673', '#2f7de1', '#8a5cf6', '#ff6fa8', '#8b5a2b'];
const STAMPS = ['⭐', '🌈', '☁️', '🪽', '🌙', '🌸'];
let color = COLORS[1], size = 10, mode = 'pen', stamp = '⭐';

const tools = G.$('#tools');
tools.innerHTML =
  COLORS.map((c, i) => `<button class="sw ${i === 1 ? 'on' : ''}" data-c="${c}" style="background:${c}"></button>`).join('') +
  `<button class="tool on" data-m="pen">✏️</button><button class="tool" data-m="fat">🖌️</button><button class="tool" data-m="eraser">🧽</button>` +
  STAMPS.map((s) => `<button class="tool" data-m="stamp" data-s="${s}">${s}</button>`).join('') +
  `<button class="tool" data-m="bike">🚲</button><button class="tool" id="clear">🗑️</button>`;

tools.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'clear') { if (confirm('Clear the drawing?')) { ctx.clearRect(0, 0, cv.width, cv.height); } return; }
  if (b.dataset.c) { color = b.dataset.c; G.$$('.sw').forEach((x) => x.classList.toggle('on', x === b)); if (mode === 'eraser') setMode('pen', G.$('[data-m=pen]')); return; }
  setMode(b.dataset.m, b);
});
function setMode(m, b) {
  mode = m;
  stamp = b.dataset.s || stamp;
  size = m === 'fat' ? 26 : m === 'eraser' ? 44 : 10;
  G.$$('.tool').forEach((x) => x.classList.toggle('on', x === b));
}

const cv = G.$('#cv'), box = G.$('#box'), ctx = cv.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
function fit() {
  const keep = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
  cv.width = box.clientWidth * dpr; cv.height = box.clientHeight * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (keep) ctx.putImageData(keep, 0, 0);
}
fit();
window.addEventListener('resize', fit);

// Outline of a bicycle the child can decorate.
function drawBike(x, y) {
  const img = new Image();
  const svg = G.bikeSVG({ plain: true });
  img.onload = () => { const w = 360 * dpr; ctx.drawImage(img, x - w / 2, y - (w * 0.6) / 2, w, w * 0.6); };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('<svg ', '<svg width="800" height="480" '));
}

let last = null;
const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr]; };
cv.addEventListener('pointerdown', (e) => {
  const [x, y] = pos(e);
  if (mode === 'stamp') { ctx.font = `${70 * dpr}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.globalCompositeOperation = 'source-over'; ctx.fillText(stamp, x, y); G.sfx('pop'); return; }
  if (mode === 'bike') { drawBike(x, y); G.sfx('trin'); return; }
  cv.setPointerCapture(e.pointerId);
  last = [x, y];
  dot(x, y);
});
cv.addEventListener('pointermove', (e) => {
  if (!last) return;
  const [x, y] = pos(e);
  ctx.globalCompositeOperation = mode === 'eraser' ? 'destination-out' : 'source-over';
  ctx.strokeStyle = color; ctx.lineWidth = size * dpr; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(x, y); ctx.stroke();
  last = [x, y];
});
const stop = () => (last = null);
cv.addEventListener('pointerup', stop);
cv.addEventListener('pointercancel', stop);
function dot(x, y) {
  ctx.globalCompositeOperation = mode === 'eraser' ? 'destination-out' : 'source-over';
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, (size * dpr) / 2, 0, Math.PI * 2); ctx.fill();
}

G.$$('.ask-q').forEach((b) => (b.onclick = () => { G.$$('.ask-q').forEach((x) => x.classList.toggle('on', x === b)); G.say(b.dataset.q); }));
G.$('#done').onclick = () => { G.star(3); G.sfx('win'); G.confetti(); G.say('What a wonderful magic bicycle! Tell the class about it.'); };
</script>
</body>
</html>
