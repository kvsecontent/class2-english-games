<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .scene-head { display: flex; align-items: center; gap: 1rem; justify-content: center; margin-bottom: 0.5rem; }
  .scene-head .pic { font-size: 3.6rem; line-height: 1; }
  .scene-head .t { font-size: 2.2rem; font-weight: 800; }
  .lines { display: flex; flex-direction: column; gap: 0.7rem; width: 100%; max-width: 90rem; }
  .ln { display: flex; align-items: center; gap: 1rem; border-radius: 1.4rem; padding: 0.4rem 1.2rem; border: 0.25rem solid var(--line); background: #fff; box-shadow: var(--shadow); text-align: left; }
  .ln .who { font-size: 2.8rem; line-height: 1; flex: none; text-align: center; }
  .ln .who small { display: block; font-size: 1.2rem; font-weight: 800; }
  .ln .txt { font-family: var(--read); font-size: 2rem; flex: 1; }
  .ln.babli { border-color: var(--pink); background: #fff0f6; }
  .ln.jeet { border-color: var(--blue); background: #eef5ff; margin-left: 6rem; }
  .ln.now { box-shadow: 0 0 0 0.4rem var(--yellow); }
  .nav { margin-top: 0.9rem; }
  .props { font-size: 1.3rem; color: var(--muted); margin-top: 0.6rem; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint" style="margin-bottom:0.5rem">Choose a partner. One is <b>Babli</b> 👧🏽 and one is <b>Jeet</b> 👦🏽. Act out the story! Tap a line to hear it.</p>
  <div class="card center" style="width:100%;max-width:96rem">
    <div class="progress" id="pg"></div>
    <div class="scene-head"><span class="pic" id="pic"></span><span class="t" id="title"></span></div>
    <div class="lines" id="lines"></div>
    <div class="row nav">
      <button class="big-btn ghost" id="prev">◀ Back</button>
      <button class="big-btn orange" id="play">🔊 Hear the scene</button>
      <button class="big-btn green" id="clap">👏 Great acting!</button>
      <button class="big-btn ghost" id="next">Next ▶</button>
    </div>
    <div class="props">🧺 Things you can use: an old ball or rolled paper, a stick for a bat, a few rags, wool and a piece of string.</div>
  </div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Act It Out', subtitle: 'OUT! OUT! · Let us do · A · Pair work', back: '../index.html#ch2' });

/* Dialogues use words from the story. */
const SCENES = [
  { pic: '🏖️', t: 'Scene 1 · A holiday', l: [['jeet', 'It is a holiday! Let us play.'], ['babli', 'Yes! Let us skip the rope.'], ['jeet', 'Now let us play hide and seek.']] },
  { pic: '🏏', t: 'Scene 2 · Bat and ball', l: [['babli', 'Let us play bat and ball.'], ['jeet', 'I am ready to throw the ball.'], ['babli', 'Throw the ball, Jeet!']] },
  { pic: '🏡', t: 'Scene 3 · The lost ball', l: [['babli', 'I hit the ball!'], ['jeet', 'Oh no! The ball went into Mohit’s garden.'], ['babli', 'His house is locked. We cannot find the ball.'], ['jeet', 'Now the game has stopped.']] },
  { pic: '🧶', t: 'Scene 4 · Make a new ball', l: [['babli', 'I know how to make a ball!'], ['jeet', 'What do we need?'], ['babli', 'A few rags, paper and wool. And a piece of string.'], ['jeet', 'I like the new ball!']] },
  { pic: '💥', t: 'Scene 5 · OUT! OUT!', l: [['babli', 'This time I will pick the ball.'], ['jeet', 'I will pick the bat.'], ['jeet', 'I hit the ball hard!'], ['babli', 'The ball opened up! I caught a piece of rag. OUT! OUT!']] },
];
const WHO = { babli: '👧🏽<small>Babli</small>', jeet: '👦🏽<small>Jeet</small>' };
let s = 0, token = 0;

function draw() {
  token++;
  speechSynthesis.cancel();
  const sc = SCENES[s];
  G.progress(G.$('#pg'), s, SCENES.length);
  G.$('#pic').textContent = sc.pic;
  G.$('#title').textContent = sc.t;
  G.$('#lines').innerHTML = sc.l.map(([w, t], i) => `<button class="ln ${w}" data-i="${i}"><span class="who">${WHO[w]}</span><span class="txt">${t}</span></button>`).join('');
  G.$$('.ln').forEach((b) => (b.onclick = () => { token++; mark(b); G.say(sc.l[b.dataset.i][1]); }));
  G.$('#clap').disabled = false;
}
function mark(b) { G.$$('.ln').forEach((x) => x.classList.toggle('now', x === b)); }
function playFrom(i, my) {
  const all = G.$$('.ln');
  if (my !== token || i >= all.length) { mark(null); return; }
  mark(all[i]);
  G.say(SCENES[s].l[i][1], { onend: () => setTimeout(() => playFrom(i + 1, my), 500) });
}

G.$('#play').onclick = () => { token++; playFrom(0, token); };
G.$('#prev').onclick = () => { s = (s + SCENES.length - 1) % SCENES.length; draw(); };
G.$('#next').onclick = () => {
  if (s === SCENES.length - 1) { G.end({ title: '👏 Bravo!', msg: 'You acted out the whole story.', onReplay: () => { s = 0; draw(); } }); return; }
  s++; draw();
};
G.$('#clap').onclick = (e) => { G.star(2); G.sfx('win'); G.confetti(20); G.say('Great acting!'); e.currentTarget.disabled = true; };
draw();
</script>
</body>
</html>
