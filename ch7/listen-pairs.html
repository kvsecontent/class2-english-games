<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .modes { margin-bottom: 1rem; }
  .pairs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; width: 100%; max-width: 110rem; }
  .col { display: flex; flex-direction: column; gap: 0.8rem; }
  .w { position: relative; background: #fff; border: 0.25rem solid var(--line); border-radius: 1.4rem; box-shadow: var(--shadow); padding: 0.6rem; display: flex; flex-direction: column; align-items: center; font-family: var(--read); font-size: 2.8rem; font-weight: 700; min-height: 10rem; justify-content: center; }
  .w .e { font-size: 3.6rem; line-height: 1.1; }
  .w.on::after { content: ''; position: absolute; inset: 0.3rem; border: 0.45rem solid var(--red); border-radius: 50%; pointer-events: none; animation: pop 0.3s; }
  .w.good { background: #d9f7e8; border-color: var(--green); }
  .w.bad { background: #ffe1e3; border-color: var(--red); animation: shake 0.4s; }
  .col.now { outline: 0.35rem dashed var(--yellow); outline-offset: 0.4rem; border-radius: 1.4rem; }
  @media (max-width: 900px) { .pairs { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main class="stage center">
  <div class="row modes">
    <button class="big-btn purple" id="mTeacher">👩‍🏫 Teacher says</button>
    <button class="big-btn orange" id="mBoard">🔊 Board says</button>
  </div>
  <p class="hint" id="hint"></p>
  <div class="pairs" id="pairs"></div>
  <div class="row" style="margin-top:1rem" id="ctrl"></div>
  <div class="feedback" id="fb"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Which Word Did You Hear?', subtitle: 'This is My Town · Let us listen', back: '../index.html#ch7' });

/* The five pairs from the book. */
const PAIRS = [
  [{ w: 'fan', e: '🪭' }, { w: 'fin', e: '🦈' }],
  [{ w: 'wall', e: '🧱' }, { w: 'well', e: '🪣' }],
  [{ w: 'house', e: '🏠' }, { w: 'mouse', e: '🐭' }],
  [{ w: 'lane', e: '🛣️' }, { w: 'line', e: '➖' }],
  [{ w: 'skin', e: '✋' }, { w: 'swim', e: '🏊' }],
];

function draw() {
  G.$('#pairs').innerHTML = PAIRS.map((p, i) => `<div class="col" data-i="${i}">${p.map((x) => `<button class="w" data-w="${x.w}"><span class="e">${x.e}</span>${x.w}</button>`).join('')}</div>`).join('');
  G.$('#fb').textContent = '';
}

/* As in the book: the teacher says one word from each column and children circle it. */
function teacher() {
  draw();
  G.$('#hint').innerHTML = 'Listen to your teacher. Your teacher says one word from each column. Tap the word you hear to circle it.';
  G.$('#ctrl').innerHTML = '<button class="big-btn ghost" id="clear">🧹 Clear circles</button>';
  G.$$('.w').forEach((b) => (b.onclick = () => {
    G.$$('.w', b.parentElement).forEach((x) => x !== b && x.classList.remove('on'));
    b.classList.toggle('on');
    G.sfx('pop');
  }));
  G.$('#clear').onclick = () => G.$$('.w').forEach((x) => x.classList.remove('on'));
}

/* The board says one word from each column, one column at a time. */
function board() {
  draw();
  let col = 0, said = [], firstTry = true;
  G.$('#hint').innerHTML = 'Listen! The board says one word. Tap the word you hear.';
  G.$('#ctrl').innerHTML = '<button class="big-btn green" id="again">🔊 Say it again</button>';
  const next = () => {
    if (col >= PAIRS.length) { G.end({ title: 'Super listening!', msg: 'You heard every word.', onReplay: board }); return; }
    G.$$('.col').forEach((c, i) => c.classList.toggle('now', i === col));
    said[col] = PAIRS[col][Math.random() < 0.5 ? 0 : 1].w;
    firstTry = true;
    setTimeout(() => G.say(said[col], { rate: 0.7 }), 400);
  };
  G.$('#again').onclick = () => said[col] && G.say(said[col], { rate: 0.7 });
  G.$$('.w').forEach((b) => (b.onclick = () => {
    if (+b.parentElement.dataset.i !== col) return;
    if (b.dataset.w === said[col]) {
      b.classList.add('on', 'good');
      if (firstTry) G.star();
      G.sfx('good');
      G.feedback(G.$('#fb'), true, `🎉 Yes! “${said[col]}”`);
      col++;
      setTimeout(next, 1400);
    } else {
      firstTry = false;
      b.classList.add('bad');
      G.sfx('bad');
      G.feedback(G.$('#fb'), false, '🙂 Listen again!');
      setTimeout(() => { b.classList.remove('bad'); G.say(said[col], { rate: 0.7 }); }, 600);
    }
  }));
  next();
}

G.$('#mTeacher').onclick = teacher;
G.$('#mBoard').onclick = board;
teacher();
</script>
</body>
</html>
