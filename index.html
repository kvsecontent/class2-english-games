<style>
  .hero {
    display: flex; align-items: center; gap: 1.2rem;
    padding: 1rem 1.6rem; background: linear-gradient(120deg, #ffe08a, #ffb38a 60%, #ff9fc2);
  }
  .hero .logo { font-size: 4rem; animation: bob 2.5s ease-in-out infinite; }
  .hero h1 { margin: 0; font-size: 2.6rem; line-height: 1; }
  .hero p { margin: 0.2rem 0 0; font-size: 1.2rem; font-weight: 700; color: #5a3d2b; }
  .hero .spacer { flex: 1; }

  .tabs {
    display: flex; gap: 0.6rem; overflow-x: auto; padding: 0.9rem 1.6rem 0.4rem;
    scrollbar-width: thin; background: #fff; border-bottom: 0.25rem solid var(--line);
    position: sticky; top: 0; z-index: 20;
  }
  .tab {
    flex: none; border: 0.2rem solid var(--line); background: #fff;
    border-radius: 1.2rem 1.2rem 0.4rem 0.4rem; padding: 0.5rem 1.2rem; min-height: 4rem;
    font-size: 1.2rem; font-weight: 800; text-align: left; line-height: 1.1;
  }
  .tab small { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
  .tab.on { background: var(--purple); border-color: var(--purple); color: #fff; }
  .tab.on small { color: #e9e0ff; }
  .tab.soon { opacity: 0.55; }

  .chap-head { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin: 0.6rem 0 0.4rem; }
  .chap-head h2 { margin: 0; font-size: 2.3rem; }
  .chap-head span { font-size: 1.2rem; color: var(--muted); font-weight: 700; }

  .section-title {
    font-size: 1.35rem; font-weight: 800; margin: 1.4rem 0 0.6rem;
    display: inline-block; padding: 0.2rem 1rem; border-radius: 2rem; color: #fff;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 1rem; margin-top: 0.8rem; }
  .tag { align-self: flex-start; color: #fff; font-size: 0.95rem; font-weight: 800; padding: 0.1rem 0.7rem; border-radius: 1rem; }
  .game {
    display: flex; flex-direction: column; gap: 0.3rem; text-decoration: none; color: inherit;
    background: #fff; border-radius: var(--radius); border: 0.22rem solid var(--line);
    box-shadow: 0 0.45rem 0 rgba(43, 33, 64, 0.1); padding: 0.8rem 1.1rem; min-height: 9rem;
    transition: transform 0.12s;
  }
  .game:active { transform: scale(0.97); }
  .game .ic { font-size: 3rem; line-height: 1.1; }
  .game b { font-size: 1.5rem; }
  .game em { font-style: normal; color: var(--muted); font-size: 1.05rem; font-weight: 600; }
  .soon-box { text-align: center; padding: 3rem 1rem; font-size: 1.6rem; color: var(--muted); }
  .soon-box div { font-size: 5rem; }
</style>

const tabs = document.getElementById('tabs');
const main = document.getElementById('main');

function show(n) {
  const ch = CHAPTERS.find((c) => c.n === n) || CHAPTERS[0];
  [...tabs.children].forEach((b) => b.classList.toggle('on', +b.dataset.n === ch.n));
  history.replaceState(null, '', '#ch' + ch.n);
  if (!ch.sections.length) {
    main.innerHTML = `<div class="soon-box"><div>🚧</div>Chapter ${ch.n} games are coming soon!</div>`;
    return;
  }
  main.innerHTML = `
    <div class="chap-head"><h2>Chapter ${ch.n} · ${ch.title}</h2><span>${ch.unit}</span></div>
    <div class="grid">${ch.sections.map((s) => s.games.map((g) => `
      <a class="game" href="${g.href}" style="border-color:${COLORS[s.key]}55">
        <span class="tag" style="background:${COLORS[s.key]}">${s.name}</span>
        <span class="ic">${g.ic}</span><b>${g.t}</b><em>${g.d}</em>
      </a>`).join('')).join('')}
    </div>`;
}

tabs.innerHTML = CHAPTERS.map((c) => `
  <button class="tab ${c.sections.length ? '' : 'soon'}" data-n="${c.n}">Chapter ${c.n}<small>${c.title}</small></button>`).join('');
tabs.addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) show(+b.dataset.n); });

show(+(location.hash.match(/ch(\d+)/)?.[1] || 1));
