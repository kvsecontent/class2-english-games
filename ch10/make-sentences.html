<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .modes { margin-bottom: 0.8rem; }
  .sent { font-family: var(--read); font-size: 2.6rem; display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; justify-content: center; margin: 0.4rem 0; }
  .gap { display: inline-flex; align-items: center; justify-content: center; min-width: 12rem; height: 4.6rem; border-radius: 0.8rem; padding: 0 0.8rem;
    border: 0.25rem dashed var(--orange); background: #fffaf0; color: var(--orange); }
  .gap.filled { border-style: solid; border-color: var(--green); background: #d9f7e8; color: #117a4a; font-weight: 700; animation: pop 0.35s; }
  .bank { display: flex; flex-wrap: wrap; gap: 0.7rem; justify-content: center; margin: 0.4rem 0 0.8rem; max-width: 110rem; }
  .bank-label { font-size: 1.3rem; font-weight: 800; color: var(--muted); }
  .chip { border: 0; border-radius: 1rem; color: #fff; font-family: var(--read); font-size: 1.9rem; font-weight: 700;
    padding: 0.4rem 1.1rem; min-height: 4rem; box-shadow: 0 0.35rem 0 rgba(0, 0, 0, 0.2); }
  .chip.a { background: var(--blue); } .chip.b { background: var(--pink); }
  .mine { font-family: var(--read); font-size: 1.8rem; width: 100%; max-width: 80rem; min-height: 6rem; }
  .mine ol { margin: 0.2rem 0; padding-left: 2.4rem; }
  .ex { font-family: var(--read); font-size: 1.5rem; color: var(--muted); }
</style>
</head>
<body>
<main class="stage center">
  <div id="area" style="width:100%" class="center"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Make Sentences', subtitle: 'The Crow · Let us write · One word from each box', back: '../index.html#ch10' });

const MODES = {
  go: {
    hint: 'Make sentences using one word from each box. Drag a word to each gap (or tap the word, then the gap).',
    ex: 'e.g. Rajni will go to a park.',
    parts: ['a', 'will go to a', 'b', '.'],
    a: ['I', 'We', 'She', 'Rajni', 'Harish'],
    b: ['village', 'school', 'park', 'farm', 'theatre'],
    need: 5,
  },
};
const area = G.$('#area');

function run(key) {
  const M = MODES[key];
  const made = [];
  area.innerHTML = `<p class="hint">${M.hint}</p>
    <div class="card" style="width:100%;max-width:90rem">
      <div class="ex">${M.ex}</div>
      <div class="sent" id="sent">${M.parts.map((p) => (p === 'a' || p === 'b' ? `<span class="gap" data-k="${p}">?</span>` : `<span>${p}</span>`)).join('')}</div>
    </div>
    ${['a', 'b'].filter((k) => M[k]).map((k) => `<div class="bank-label">${k === 'a' ? 'Who?' : 'Where?'}</div>
      <div class="bank">${M[k].map((w) => `<button class="chip ${k}" data-k="${k}" data-w="${w}">${w}</button>`).join('')}</div>`).join('')}
    <div class="card mine"><b style="font-family:var(--head)">✏️ My sentences (${M.need})</b><ol id="list"></ol></div>`;
  const gaps = G.$$('.gap');
  const reset = () => gaps.forEach((g) => { g.textContent = '?'; g.classList.remove('filled'); delete g.dataset.w; });
  G.tapDrag(G.$$('.chip'), gaps, (chip, gap) => {
    if (chip.dataset.k !== gap.dataset.k) { G.sfx('bad'); return; }
    gap.dataset.w = chip.dataset.w;
    gap.textContent = chip.dataset.w;
    gap.classList.add('filled');
    G.sfx('pop');
    if (gaps.every((g) => g.dataset.w)) {
      const s = M.parts.map((p) => (p === 'a' || p === 'b' ? G.$(`.gap[data-k="${p}"]`).dataset.w : p)).join(' ').replace(' .', '.').trim();
      if (made.includes(s)) { G.say('You already have this one. Try a new sentence!'); setTimeout(reset, 1200); return; }
      made.push(s);
      G.$('#list').insertAdjacentHTML('beforeend', `<li>${s}</li>`);
      G.star(); G.sfx('good');
      G.say(s);
      setTimeout(reset, 1400);
      if (made.length === M.need) setTimeout(() => G.end({ title: 'Well done!', msg: 'Now write your sentences in your notebook.', onReplay: () => run(key) }), 2400);
    }
  });
}
run('go');
</script>
</body>
</html>
