<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .sky { position: relative; height: calc(100vh - 13rem); min-height: 26rem; border-radius: var(--radius); overflow: hidden; background: linear-gradient(#5fb3f5, #bfe6ff 75%, #9be38a 75%); }
  .kid { position: absolute; bottom: 2%; left: 4%; font-size: 5rem; transform: rotate(-80deg); pointer-events: none; }
  .cloud { position: absolute; border: 0; background: none; padding: 0; width: 18rem; height: 11rem; animation: drift linear infinite alternate; }
  .cloud .puff { position: absolute; inset: 0; font-size: 11rem; line-height: 1; transition: opacity 0.6s, transform 0.6s; filter: drop-shadow(0 0.3rem 0.4rem rgba(0, 0, 0, 0.15)); }
  .cloud .shape { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9rem; line-height: 1; opacity: 0; transform: scale(0.6); transition: opacity 0.6s, transform 0.6s;
    filter: brightness(0) invert(1) drop-shadow(0 0 0.6rem rgba(255, 255, 255, 0.9)) drop-shadow(0 0.3rem 0.4rem rgba(0, 0, 0, 0.2)); }
  .cloud.open .puff { opacity: 0; transform: scale(1.3); }
  .cloud.open .shape { opacity: 1; transform: scale(1); }
  .say-box { position: absolute; right: 2%; bottom: 3%; background: #fff; border-radius: 1.2rem; padding: 0.6rem 1.2rem; font-family: var(--read); font-size: 2.2rem; font-weight: 700; box-shadow: var(--shadow); min-width: 22rem; text-align: center; }
  @keyframes drift { from { transform: translateX(-3rem); } to { transform: translateX(3rem); } }
</style>
</head>
<body>
<main class="stage">
  <p class="hint" style="text-align:center">Lie on your back and look up at the sky! Tap a cloud. What do you see? Say: “I see a ____.”</p>
  <div class="sky" id="sky">
    <span class="kid">🧒🏽</span>
    <div class="say-box" id="said">☁️ Tap a cloud!</div>
  </div>
  <div class="row" style="margin-top:0.8rem"><button class="big-btn ghost" id="again">🔁 New clouds</button></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'What Do You See in the Clouds?', subtitle: 'A Show of Clouds · Let us recite', back: '../index.html#ch8' });

/* The first three are from the poem. */
const SHAPES = [
  ['🐻', 'a big white bear'], ['⛵', 'a ship sailing'], ['🐘', 'an elephant'],
  ['🐇', 'a rabbit'], ['🐟', 'a fish'], ['🐦', 'a bird'], ['🐕', 'a dog'], ['🦒', 'a giraffe'], ['🐢', 'a turtle'],
];
const SPOTS = [[8, 6], [40, 4], [70, 8], [22, 34], [56, 32], [80, 40]];
const sky = G.$('#sky');

function build() {
  G.$$('.cloud').forEach((c) => c.remove());
  G.$('#said').textContent = '☁️ Tap a cloud!';
  const pick = [...SHAPES.slice(0, 3), ...G.shuffle(SHAPES.slice(3)).slice(0, 3)];
  G.shuffle(pick).forEach(([e, n], i) => {
    const c = document.createElement('button');
    c.className = 'cloud';
    c.style.left = SPOTS[i][0] + '%';
    c.style.top = SPOTS[i][1] + '%';
    c.style.animationDuration = 5 + Math.random() * 4 + 's';
    c.innerHTML = `<span class="puff">☁️</span><span class="shape">${e}</span>`;
    c.onclick = () => {
      const open = c.classList.toggle('open');
      if (!open) return;
      G.sfx('pop');
      G.$('#said').textContent = `I see ${n}!`;
      G.say(`I see ${n}!`);
      if (!c.dataset.seen) { c.dataset.seen = 1; G.star(); }
    };
    sky.append(c);
  });
}
G.$('#again').onclick = build;
build();
</script>
</body>
</html>
