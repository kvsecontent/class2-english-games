<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../assets/style.css">
<style>
  .q { font-family: var(--read); font-size: 2.8rem; margin: 1rem 0 1.6rem; line-height: 1.4; }
  .q .blank { display: inline-block; min-width: 7rem; border-bottom: 0.3rem dashed var(--orange); color: var(--orange); }
  .q .pic { font-size: 5rem; display: block; }
</style>
</head>
<body>
<main class="stage center">
  <p class="hint">Read the line from the poem. Tap the missing word.</p>
  <div class="card" id="game" style="width:100%;max-width:70rem"></div>
</main>
<script src="../assets/common.js"></script>
<script>
G.init({ title: 'Missing Word', subtitle: 'A Show of Clouds · Let us recite', back: '../index.html#ch8' });

const ITEMS = [
  { pic: '🧒', a: 'As I lie on my', w: 'back,', b: '', opts: ['back,', 'bed,', 'bag,'] },
  { pic: '☁️', a: 'Looking up at the', w: 'sky.', b: '', opts: ['sky.', 'sea.', 'tree.'] },
  { pic: '🐻‍❄️', a: 'I see a big white', w: 'bear,', b: '', opts: ['bear,', 'bird,', 'bus,'] },
  { pic: '👇', a: 'Looking', w: 'down', b: 'at me.', opts: ['down', 'up', 'in'] },
  { pic: '⛵', a: 'I see a ship', w: 'sailing,', b: '', opts: ['sailing,', 'flying,', 'running,'] },
  { pic: '🌊', a: 'On a white', w: 'sea.', b: '', opts: ['sea.', 'sky.', 'sun.'] },
  { pic: '🐘', a: 'I see an', w: 'elephant,', b: '', opts: ['elephant,', 'egg,', 'engine,'] },
  { pic: '👋', a: 'Waving its', w: 'trunk', b: 'at me.', opts: ['trunk', 'tail', 'hand'] },
  { pic: '😄', a: 'Oh! It’s fun, it’s', w: 'fun', b: 'to me,', opts: ['fun', 'sad', 'sun'] },
  { pic: '👀', a: 'To see whatever I want to', w: 'see.', b: '', opts: ['see.', 'sea.', 'say.'] },
];

G.quiz({
  el: G.$('#game'),
  items: ITEMS,
  shuffleItems: false,
  question: (it) => `<span class="pic">${it.pic}</span>${it.a} <span class="blank">&nbsp;?&nbsp;</span> ${it.b}`,
  options: (it) => G.shuffle(it.opts).map((o) => ({ label: o, value: o })),
  answer: (it) => it.w,
  onShow: (it, el) => {
    const s = el.querySelector('.q');
    G.$$('.choice', el).forEach((b) => b.addEventListener('click', () => {
      if (b.classList.contains('right')) s.querySelector('.blank').textContent = it.w;
    }));
  },
  explain: (it) => `${it.a} ${it.w} ${it.b}`,
  endMsg: 'You know the poem "A Show of Clouds"!',
});
</script>
</body>
</html>
